name: Validate shared publishing implementation
on:
  push:
    branches: [feature/shared-publishing-20260918]
    paths: ['.publishing-upgrade/**', '.github/workflows/materialize-publishing.yml']
permissions:
  contents: write
jobs:
  materialize:
    if: github.ref == 'refs/heads/feature/shared-publishing-20260918'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify and expand implementation
        run: |
          python - <<'PY'
          import base64, hashlib, io, pathlib, tarfile
          raw = base64.b64decode(''.join(p.read_text().strip() for p in sorted(pathlib.Path('.publishing-upgrade').glob('part*.b64'))), validate=True)
          assert hashlib.sha256(raw).hexdigest() == '343e4f1dc7fa68b19c9e723ec8e18ef6e27628c41ee20cb13420470afb39f42c'
          with tarfile.open(fileobj=io.BytesIO(raw), mode='r:gz') as archive:
            archive.extractall('.', filter='data')
          patch = pathlib.Path('.publishing-patch.py')
          patch.write_text(patch.read_text().replace("'                  document={activeDocument}\\n                  state={state}'", "'document={activeDocument} state={state}'"))
          PY
          python .publishing-patch.py
          rm .publishing-patch.py
      - run: npm ci
      - name: Shared publishing tests
        run: node --test tests/publishing-links.test.mjs tests/shared-publishing.test.mjs tests/publishing-panel.test.mjs
      - name: Existing navigation and writing regression tests
        run: node --test tests/admin-navigation.test.mjs tests/publications-module.test.mjs tests/writing-react.test.mjs tests/writing-database.test.mjs
      - run: npm run test:workspace
      - name: Production build
        run: npm run build
      - name: Commit verified implementation to feature branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src docs tests supabase
          git commit -m 'Implement shared publication editions, report chapters and workspace linking'
          git push origin HEAD:feature/shared-publishing-20260918
