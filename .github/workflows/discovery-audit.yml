name: Article discovery and retries
on:
  schedule:
    - cron: '23 * * * *'
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: meridian-discovery-production
  cancel-in-progress: false
jobs:
  discovery:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Wait for discovery routes on the production domain
        run: |
          python3 - <<'PY'
          import sys, time
          sys.path.insert(0, 'scripts')
          from discovery_audit import download, ORIGIN
          import json
          from pathlib import Path
          key = json.loads(Path('src/lib/publishing/discovery-config.json').read_text())['key']
          for attempt in range(18):
              try:
                  code, proof, _, _ = download(f'{ORIGIN}/{key}.txt')
                  if code == 200 and proof.strip() == key and download(ORIGIN + '/artikelen/sitemap.xml')[0] == 200 and download(ORIGIN + '/feed.xml')[0] == 200:
                      break
              except Exception:
                  pass
              time.sleep(10)
          else:
              raise SystemExit('Production discovery routes not ready; no notifications sent.')
          PY
      - uses: actions/cache/restore@v4
        with:
          path: .seo-discovery/state.json
          key: discovery-state-v1-main-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: discovery-state-v1-main-
      - name: Check live articles and notify only changed public URLs
        run: python3 scripts/discovery_audit.py --submit
      - uses: actions/cache/save@v4
        if: always() && hashFiles('.seo-discovery/state.json') != ''
        with:
          path: .seo-discovery/state.json
          key: discovery-state-v1-main-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: discovery-report
          path: .seo-discovery/report.json
          retention-days: 30
          if-no-files-found: ignore
