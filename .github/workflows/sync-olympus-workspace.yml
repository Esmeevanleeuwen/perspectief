name: Update shared Olympus workspace

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/sync-olympus-workspace.yml
      - scripts/sync-workspace-ui.mjs
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-olympus-workspace
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Import the shared package from one Olympus commit
        run: node scripts/sync-workspace-ui.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Check for an update
        id: changes
        run: |
          if git diff --quiet -- vendor/olympus-workspace-ui; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          else
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Install dependencies
        if: steps.changes.outputs.changed == 'true'
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Check the shared package source and feature behavior
        if: steps.changes.outputs.changed == 'true'
        run: npm run test:workspace
      - name: Build Meridian with the updated package
        if: steps.changes.outputs.changed == 'true'
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://frvkibbrbxiqrlmlfnxc.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_J1aJ-ACeInAJOZd7SkcaJw_DMjsEHN2
      - name: Save the verified update
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add vendor/olympus-workspace-ui package-lock.json
          git commit -m 'Update shared Olympus workspace'
          git push origin HEAD:main
